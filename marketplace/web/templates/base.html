<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Talos Marketplace{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Explore and install autonomous agents and skills on Talos.{% endblock %}">
  
  <!-- Open Graph -->
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:title" content="{% block og_title %}Talos Marketplace{% endblock %}">
  <meta property="og:description" content="{% block og_desc %}Explore plugins on Talos Marketplace{% endblock %}">
  <meta property="og:image" content="{% block og_image %}/og/default.png{% endblock %}">
  <meta property="og:url" content="{% block og_url %}{{ canonical_url }}{% endblock %}">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block tw_title %}{% endblock %}">
  <meta name="twitter:description" content="{% block tw_desc %}{% endblock %}">
  <meta name="twitter:image" content="{% block tw_image %}{% endblock %}">
  
  <link rel="canonical" href="{{ canonical_url }}">
  
  {% block json_ld %}{% endblock %}

  <style>
    :root {
      --bg: #0b0f17;
      --card-bg: #111827;
      --card-border: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding: 0;
      margin: 0;
    }
    nav {
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand { font-size: 1.25rem; font-weight: 700; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
    .brand span { color: var(--primary); }
    .nav-links a { color: var(--text-muted); text-decoration: none; margin-left: 1.5rem; font-size: 0.95rem; }
    .nav-links a:hover { color: #fff; }
    .container { max-width: 1040px; margin: 2rem auto; padding: 0 1.5rem; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 2rem; margin-bottom: 2rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #1f2937; color: var(--text-main); border: 1px solid #374151; }
    .btn-secondary:hover { background: #374151; }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #1e1b4b;
      color: #a5b4fc;
      border: 1px solid #312e81;
    }
    .badge-official { background: #064e3b; color: #6ee7b7; border-color: #047857; }
    .badge-verified { background: #0c4a6e; color: #7dd3fc; border-color: #0369a1; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="brand">TALOS <span>MARKETPLACE</span></a>
    <div class="nav-links">
      <a href="/plugins">Plugins</a>
      <a href="/builders">Builders</a>
      <a href="https://talos.ai" target="_blank">Download App</a>
    </div>
  </nav>

  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
