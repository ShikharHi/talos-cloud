version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: talos
      POSTGRES_PASSWORD: talosdev
      POSTGRES_DB: talos_cloud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talos -d talos_cloud"]
      interval: 5s
      timeout: 5s
      retries: 10

  talos-cloud:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://talos:talosdev@postgres:5432/talos_cloud"
      JWT_SECRET: "dev-only-secret-change-in-production"
      JWT_ALGORITHM: "HS256"
      TOKEN_EXPIRY_MINUTES: "60"
      TALOS_ENV: "development"
    ports:
      - "8001:8001"
    volumes:
      - ./config:/app/config:ro

volumes:
  postgres_data:
